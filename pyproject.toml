[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "springinsight"
version = "0.1.0"
description = "Autonomous multi-agent codebase intelligence for Java / Spring Boot"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["spring-boot", "java", "code-review", "security", "agents", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

dependencies = [
    # CLI
    "click>=8.1,<9",
    "rich>=13,<14",
    # Database
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20,<1",
    # Config
    "pyyaml>=6.0,<7",
    "pydantic>=2.8,<3",
    # HTTP (GitHub clone checks)
    "httpx>=0.27,<1",
    # Git
    "gitpython>=3.1,<4",
    # Async
    "anyio>=4.0,<5",
    # Packaging tools for CVE scanning
    "packaging>=24.0",
    # .env file support (optional — falls back to built-in parser)
    "python-dotenv>=1.0,<2; python_version>='3.10'",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.12",
    "aiofiles>=23,<25",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<1",
    "httpx>=0.27,<1",       # FastAPI TestClient dependency
]
all = [
    "springinsight[web]",
]

[project.scripts]
springinsight = "springinsight.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["springinsight*"]

[tool.setuptools.package-data]
"springinsight" = [
    "skills/**/*.md",
    "skills/**/*.yaml",
    "web/templates/*.html",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
